[package]
name = "cons-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Consensus-building pipeline shared by autocons and te-composer"

[lib]
name = "cons_core"
path = "src/lib.rs"

[dependencies]
aln-core.workspace = true
aln-coord.workspace = true
aln-engine.workspace = true
aln-reference.workspace = true
aln-rmblast.workspace = true
rayon.workspace = true

# parasail vendors only x86 SIMD kernels, so it is a dependency only there.
# Elsewhere `FastAligner` is the scalar reference aligner.
[target.'cfg(any(target_arch = "x86_64", target_arch = "x86"))'.dependencies]
aln-parasail.workspace = true
